name: linkorder
networks:
  egress-wejscie:
    driver: bridge
    enable_ipv6: false
    internal: true
    name: linkorder_egress-wejscie
  egress-wyjscie:
    driver: bridge
    enable_ipv6: false
    name: linkorder_egress-wyjscie
  front:
    driver: bridge
    enable_ipv6: false
    internal: true
    name: linkorder_front
  public:
    driver: bridge
    enable_ipv6: false
    name: linkorder_public
  valkey:
    driver: bridge
    enable_ipv6: false
    internal: true
    name: linkorder_valkey
secrets:
  app_key:
    file: /var/lib/linkorder/secrets/app/app_key
    name: linkorder_app_key
  db_app_relay:
    file: /var/lib/linkorder/secrets/db/app_relay
    name: linkorder_db_app_relay
  db_app_scheduler:
    file: /var/lib/linkorder/secrets/db/app_scheduler
    name: linkorder_db_app_scheduler
  db_app_web:
    file: /var/lib/linkorder/secrets/db/app_web
    name: linkorder_db_app_web
  db_app_worker:
    file: /var/lib/linkorder/secrets/db/app_worker
    name: linkorder_db_app_worker
  db_migrator:
    file: /var/lib/linkorder/secrets/db/migrator
    name: linkorder_db_migrator
  totp_key:
    file: /var/lib/linkorder/secrets/app/totp_key
    name: linkorder_totp_key
  valkey_bulk:
    file: /var/lib/linkorder/secrets/valkey/bulk
    name: linkorder_valkey_bulk
  valkey_bulk_hash:
    file: /var/lib/linkorder/secrets/valkey/bulk.sha256
    name: linkorder_valkey_bulk_hash
  valkey_panel:
    file: /var/lib/linkorder/secrets/valkey/panel
    name: linkorder_valkey_panel
  valkey_panel_hash:
    file: /var/lib/linkorder/secrets/valkey/panel.sha256
    name: linkorder_valkey_panel_hash
  valkey_relay:
    file: /var/lib/linkorder/secrets/valkey/relay
    name: linkorder_valkey_relay
  valkey_relay_hash:
    file: /var/lib/linkorder/secrets/valkey/relay.sha256
    name: linkorder_valkey_relay_hash
  valkey_scheduler:
    file: /var/lib/linkorder/secrets/valkey/scheduler
    name: linkorder_valkey_scheduler
  valkey_scheduler_hash:
    file: /var/lib/linkorder/secrets/valkey/scheduler.sha256
    name: linkorder_valkey_scheduler_hash
  valkey_worker:
    file: /var/lib/linkorder/secrets/valkey/worker
    name: linkorder_valkey_worker
  valkey_worker_hash:
    file: /var/lib/linkorder/secrets/valkey/worker.sha256
    name: linkorder_valkey_worker_hash
  vault_private_key:
    file: /var/lib/linkorder/secrets/app/vault_private_key
    name: linkorder_vault_private_key
  vault_public_key:
    file: /var/lib/linkorder/secrets/app/vault_public_key
    name: linkorder_vault_public_key
services:
  cli:
    cap_drop:
      - ALL
    command:
      - php
      - artisan
      - list
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      APP_KEY_FILE: /run/secrets/app_key
      APP_URL: https://${LINKORDER_APP_HOST:?brak nazwy panelu}
      DB_DATABASE: linkorder
      DB_HOST: /var/run/postgresql
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_USERNAME: app_web
      LINKORDER_HOOKS_URL: https://${LINKORDER_HOOKS_HOST:?brak nazwy adresu powiadomień}
      LINKORDER_ROLE: cli
      PHP_MEMORY_LIMIT: 256M
      QUEUE_CONNECTION: "null"
      REDIS_CACHE_HOST: valkey-cache
      REDIS_HOST: valkey-core
      REDIS_PREFIX: 'lo:'
    image: ghcr.io/collreview/linkorder-app@sha256:e4719db370fc467e000bf943dda6e14264d2edaa1147de4a00593cc7aa22583c
    init: true
    mem_limit: ${LINKORDER_MEM_CLI:?}
    memswap_limit: ${LINKORDER_MEM_CLI:?}
    network_mode: none
    oom_score_adj: 600
    pids_limit: 32
    profiles:
      - jobs
    pull_policy: never
    read_only: true
    restart: 'no'
    secrets:
      - source: app_key
        target: /run/secrets/app_key
      - source: db_app_web
        target: db_password
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=32m,mode=0755,uid=10001,gid=10000
    user: 10001:10000
    volumes:
      - read_only: true
        source: pg-socket
        target: /var/run/postgresql
        type: volume
  edge:
    cap_drop:
      - ALL
    depends_on:
      web-panel:
        condition: service_healthy
        required: true
    environment:
      LINKORDER_APP_HOST: ${LINKORDER_APP_HOST:?brak nazwy panelu}
      LINKORDER_HOOKS_HOST: ${LINKORDER_HOOKS_HOST:?brak nazwy adresu powiadomień}
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 20s
      test:
        - CMD
        - /usr/local/bin/linkorder-edge-health
      timeout: 5s
    image: ghcr.io/collreview/linkorder-edge@sha256:90385d121c456235d99e448ce7c46b5012abe2fd95ca8ebc0056d10385dc9b2b
    init: true
    mem_limit: ${LINKORDER_MEM_EDGE:?}
    memswap_limit: ${LINKORDER_MEM_EDGE:?}
    networks:
      front: null
      public: null
    oom_score_adj: 500
    pids_limit: 128
    ports:
      - host_ip: 0.0.0.0
        mode: ingress
        protocol: tcp
        published: "80"
        target: 8080
      - host_ip: 0.0.0.0
        mode: ingress
        protocol: tcp
        published: "443"
        target: 8443
    pull_policy: never
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    stop_signal: SIGQUIT
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,mode=0755,uid=10002,gid=10002
    ulimits:
      nofile:
        hard: 65536
        soft: 65536
    user: 10002:10002
    volumes:
      - bind:
          create_host_path: false
        read_only: true
        source: /var/lib/linkorder/tls
        target: /etc/linkorder/tls
        type: bind
      - bind:
          create_host_path: false
        read_only: true
        source: /var/lib/linkorder/acme/webroot
        target: /srv/acme
        type: bind
  egress:
    cap_drop:
      - ALL
    environment:
      LINKORDER_EGRESS_MODE: ${LINKORDER_EGRESS_MODE:-demo}
      LINKORDER_EGRESS_SANDBOX: ${LINKORDER_EGRESS_SANDBOX:-0}
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 10s
      test:
        - CMD
        - /usr/local/bin/egress
        - health
      timeout: 5s
    image: ghcr.io/collreview/linkorder-egress@sha256:6f2b8106a8911e6921e63c69fd27243447e2b34b32eabfe47feded36d4c20f91
    init: true
    mem_limit: ${LINKORDER_MEM_EGRESS:?}
    memswap_limit: ${LINKORDER_MEM_EGRESS:?}
    networks:
      egress-wejscie: null
      egress-wyjscie: null
    oom_score_adj: 500
    pids_limit: 64
    pull_policy: never
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    user: 10005:10005
  migrate:
    cap_drop:
      - ALL
    command:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      APP_KEY_FILE: /run/secrets/app_key
      APP_URL: https://${LINKORDER_APP_HOST:?brak nazwy panelu}
      DB_DATABASE: linkorder
      DB_HOST: /var/run/postgresql
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_USERNAME: migrator
      LINKORDER_HOOKS_URL: https://${LINKORDER_HOOKS_HOST:?brak nazwy adresu powiadomień}
      LINKORDER_ROLE: migrate
      PHP_MEMORY_LIMIT: 512M
      QUEUE_CONNECTION: "null"
      REDIS_CACHE_HOST: valkey-cache
      REDIS_HOST: valkey-core
      REDIS_PREFIX: 'lo:'
    image: ghcr.io/collreview/linkorder-app@sha256:e4719db370fc467e000bf943dda6e14264d2edaa1147de4a00593cc7aa22583c
    init: true
    mem_limit: ${LINKORDER_MEM_MIGRATE:?}
    memswap_limit: ${LINKORDER_MEM_MIGRATE:?}
    network_mode: none
    oom_score_adj: 600
    pids_limit: 32
    profiles:
      - jobs
    pull_policy: never
    read_only: true
    restart: 'no'
    secrets:
      - source: app_key

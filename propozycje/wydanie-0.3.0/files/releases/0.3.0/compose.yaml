    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        - CMD
        - /usr/local/bin/linkorder-valkey-health
      timeout: 5s
    image: ghcr.io/collreview/linkorder-valkey@sha256:f7b4634fe04ae2a1e90843449c22c218346413b78fa6cf3474d19437c658a57e
    init: true

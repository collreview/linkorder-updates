    network_mode: none
    oom_score_adj: -1000
    pids_limit: 512
    pull_policy: never
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    stop_grace_period: 120s
    stop_signal: SIGINT
    tmpfs:
      - /tmp:size=64m,mode=1777
    ulimits:
      nofile:
        hard: 65536
        soft: 65536
    user: 10999:10999
    volumes:
      - bind:
          create_host_path: false
        source: /var/lib/linkorder/postgres
        target: /var/lib/postgresql
        type: bind
      - source: pg-socket
        target: /var/run/postgresql
        type: volume
  relay:
    cap_drop:
      - ALL
    command:
      - relay
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      valkey-core:
        condition: service_healthy
        required: true
    environment:
      APP_KEY_FILE: /run/secrets/app_key
      APP_URL: https://${LINKORDER_APP_HOST:?brak nazwy panelu}
      DB_DATABASE: linkorder

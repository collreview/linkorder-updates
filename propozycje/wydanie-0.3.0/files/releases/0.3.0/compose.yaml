      REDIS_HOST: valkey-core
      REDIS_PASSWORD_FILE: /run/secrets/valkey_password
      REDIS_PREFIX: 'lo:'
      REDIS_USERNAME: relay
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
        - CMD
        - /usr/local/bin/linkorder-health
        - heartbeat
        - "120"
      timeout: 5s
    image: ghcr.io/collreview/linkorder-app@sha256:e4719db370fc467e000bf943dda6e14264d2edaa1147de4a00593cc7aa22583c

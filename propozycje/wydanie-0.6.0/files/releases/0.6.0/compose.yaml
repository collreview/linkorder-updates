  front-hooks:
    driver: bridge
    enable_ipv6: false
    internal: true
    name: linkorder_front-hooks
  kopie:
    driver: bridge
    enable_ipv6: false
    internal: true
    name: linkorder_kopie
  public:
    driver: bridge
    enable_ipv6: false
    name: linkorder_public
  valkey:
    driver: bridge
    enable_ipv6: false
    internal: true
    name: linkorder_valkey
secrets:
  app_key:
    file: /var/lib/linkorder/secrets/app/app_key
    name: linkorder_app_key
  backup_pgp_public_key:
    file: /var/lib/linkorder/secrets/backup/pgp_public_key.asc

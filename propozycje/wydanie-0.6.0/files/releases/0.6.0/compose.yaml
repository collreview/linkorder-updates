  webhooks_public_key:
    file: /var/lib/linkorder/secrets/app/webhooks_public_key
    name: linkorder_webhooks_public_key
services:
  cli:
    cap_drop:
      - ALL
    command:
      - php
      - artisan
      - list
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      APP_KEY_FILE: /run/secrets/app_key
      APP_URL: https://${LINKORDER_APP_HOST:?brak nazwy panelu}
      DB_DATABASE: linkorder
      DB_HOST: /var/run/postgresql
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_USERNAME: app_web
      LINKORDER_HOOKS_URL: https://${LINKORDER_HOOKS_HOST:?brak nazwy adresu powiadomień}
      LINKORDER_ROLE: cli
      PHP_MEMORY_LIMIT: 256M
      QUEUE_CONNECTION: "null"
      REDIS_CACHE_HOST: valkey-cache
      REDIS_HOST: valkey-core
      REDIS_PREFIX: 'lo:'
    image: ghcr.io/collreview/linkorder-app@sha256:31cf3ee023029e2cdcea3412ad42bff89ae9a3ff249e2b95331daa80aaddc6c9
    init: true
    mem_limit: ${LINKORDER_MEM_CLI:?}
    memswap_limit: ${LINKORDER_MEM_CLI:?}
    network_mode: none
    oom_score_adj: 600
    pids_limit: 32
    profiles:
      - jobs
    pull_policy: never
    read_only: true
    restart: 'no'
    secrets:
      - source: app_key
        target: /run/secrets/app_key
      - source: db_app_web
        target: db_password
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=32m,mode=0755,uid=10001,gid=10000
    user: 10001:10000
    volumes:
      - read_only: true
        source: pg-socket
        target: /var/run/postgresql
        type: volume
  edge:
    cap_drop:
      - ALL
    depends_on:
      web-panel:
        condition: service_healthy
        required: true
    environment:
      LINKORDER_APP_HOST: ${LINKORDER_APP_HOST:?brak nazwy panelu}
      LINKORDER_HOOKS_HOST: ${LINKORDER_HOOKS_HOST:?brak nazwy adresu powiadomień}
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 20s
      test:
        - CMD
        - /usr/local/bin/linkorder-edge-health
      timeout: 5s
    image: ghcr.io/collreview/linkorder-edge@sha256:21eedd65d97069e45f69c42e2723316ee3298bde19b6c54379a487c8aa109877
    init: true
    mem_limit: ${LINKORDER_MEM_EDGE:?}
    memswap_limit: ${LINKORDER_MEM_EDGE:?}
    networks:
      front: null
      front-api: null
      front-hooks: null
      public: null
    oom_score_adj: 500
    pids_limit: 128
    ports:
      - host_ip: 0.0.0.0
        mode: ingress
        protocol: tcp
        published: "80"
        target: 8080
      - host_ip: 0.0.0.0
        mode: ingress
        protocol: tcp
        published: "443"
        target: 8443
    pull_policy: never
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    stop_signal: SIGQUIT
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,mode=0755,uid=10002,gid=10002
    ulimits:
      nofile:
        hard: 65536
        soft: 65536
    user: 10002:10002
    volumes:
      - bind:
          create_host_path: false
        read_only: true
        source: /var/lib/linkorder/tls
        target: /etc/linkorder/tls
        type: bind
      - bind:
          create_host_path: false
        read_only: true
        source: /var/lib/linkorder/acme/webroot
        target: /srv/acme
        type: bind

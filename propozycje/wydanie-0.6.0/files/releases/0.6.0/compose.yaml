      LINKORDER_EGRESS_SANDBOX: ${LINKORDER_EGRESS_SANDBOX:-0}
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 10s
      test:
        - CMD
        - /usr/local/bin/egress
        - health
      timeout: 5s
    image: ghcr.io/collreview/linkorder-egress@sha256:1914d1ff18bcf043f78e9030a6f140721fa343c225d158d4b444347ed5f7ebf5
    init: true
    mem_limit: ${LINKORDER_MEM_EGRESS:?}

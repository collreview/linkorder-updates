    name: linkorder_db_app_api
  db_app_mailer:
    file: /var/lib/linkorder/secrets/db/app_mailer
    name: linkorder_db_app_mailer
  db_app_media:
    file: /var/lib/linkorder/secrets/db/app_media
    name: linkorder_db_app_media
  db_app_relay:
    file: /var/lib/linkorder/secrets/db/app_relay
    name: linkorder_db_app_relay
  db_app_scheduler:
    file: /var/lib/linkorder/secrets/db/app_scheduler
    name: linkorder_db_app_scheduler
  db_app_web:
    file: /var/lib/linkorder/secrets/db/app_web
    name: linkorder_db_app_web
  db_app_webhook:
    file: /var/lib/linkorder/secrets/db/app_webhook
    name: linkorder_db_app_webhook
  db_app_webhooks_out:
    file: /var/lib/linkorder/secrets/db/app_webhooks_out
    name: linkorder_db_app_webhooks_out
  db_app_worker:
    file: /var/lib/linkorder/secrets/db/app_worker
    name: linkorder_db_app_worker
  db_lo_walg:
    file: /var/lib/linkorder/secrets/db/lo_walg
    name: linkorder_db_lo_walg
  db_migrator:
    file: /var/lib/linkorder/secrets/db/migrator
    name: linkorder_db_migrator
  mail_identity:
    file: /var/lib/linkorder/secrets/mail/identity.json
    name: linkorder_mail_identity
  mailer_private_key:
    file: /var/lib/linkorder/secrets/app/mailer_private_key
    name: linkorder_mailer_private_key
  mailer_public_key:
    file: /var/lib/linkorder/secrets/app/mailer_public_key
    name: linkorder_mailer_public_key
  totp_key:
    file: /var/lib/linkorder/secrets/app/totp_key

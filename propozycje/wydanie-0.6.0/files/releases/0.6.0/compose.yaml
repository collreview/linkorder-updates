    name: linkorder_vault_private_key
  vault_public_key:
    file: /var/lib/linkorder/secrets/app/vault_public_key
    name: linkorder_vault_public_key
  walg_config:
    file: /var/lib/linkorder/secrets/backup/walg.json
    name: linkorder_walg_config

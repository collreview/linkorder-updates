    name: linkorder_egress-kopie-wyjscie
  egress-poczta-wejscie:
    driver: bridge
    enable_ipv6: false
    internal: true
    name: linkorder_egress-poczta-wejscie
  egress-poczta-wyjscie:
    driver: bridge
    enable_ipv6: false
    name: linkorder_egress-poczta-wyjscie
  egress-publiczny-wejscie:
    driver: bridge
    enable_ipv6: false
    internal: true
    name: linkorder_egress-publiczny-wejscie
  egress-publiczny-wyjscie:
    driver: bridge
    enable_ipv6: false
    name: linkorder_egress-publiczny-wyjscie
  egress-wejscie:
    driver: bridge
    enable_ipv6: false
    internal: true
    name: linkorder_egress-wejscie
  egress-wyjscie:
    driver: bridge
    enable_ipv6: false
    name: linkorder_egress-wyjscie
  front:
    driver: bridge
    enable_ipv6: false
    internal: true
    name: linkorder_front
  front-api:
    driver: bridge
    enable_ipv6: false
    internal: true

    file: /var/lib/linkorder/secrets/valkey/bulk.sha256
    name: linkorder_valkey_bulk_hash
  valkey_panel:
    file: /var/lib/linkorder/secrets/valkey/panel
    name: linkorder_valkey_panel
  valkey_panel_hash:
    file: /var/lib/linkorder/secrets/valkey/panel.sha256
    name: linkorder_valkey_panel_hash
  valkey_relay:
    file: /var/lib/linkorder/secrets/valkey/relay
    name: linkorder_valkey_relay
  valkey_relay_hash:
    file: /var/lib/linkorder/secrets/valkey/relay.sha256
    name: linkorder_valkey_relay_hash
  valkey_scheduler:
    file: /var/lib/linkorder/secrets/valkey/scheduler
    name: linkorder_valkey_scheduler
  valkey_scheduler_hash:
    file: /var/lib/linkorder/secrets/valkey/scheduler.sha256
    name: linkorder_valkey_scheduler_hash
  valkey_worker:
    file: /var/lib/linkorder/secrets/valkey/worker
    name: linkorder_valkey_worker
  valkey_worker_hash:
    file: /var/lib/linkorder/secrets/valkey/worker.sha256
    name: linkorder_valkey_worker_hash
